services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # OJO: `TZ` solo fija la zona del SISTEMA OPERATIVO del contenedor. NO
      # cambia el parametro `timezone` de PostgreSQL en un volumen ya creado
      # (ver docs/REVISION_QA.md, hallazgo C-1) — por eso se refuerza abajo
      # con `command:` y, de forma definitiva, con la migracion 013.
      TZ: ${TZ:-America/Santiago}
    # Fija el `timezone` del servidor Postgres explicitamente, sin depender de
    # lo que initdb haya escrito en postgresql.conf. Necesario para que una
    # hora sin zona ("2026-04-17T21:00") se interprete como hora de Chile y no
    # como UTC (H-01: el evento de las 21:00 se publicaba a las 17:00).
    command: postgres -c timezone=America/Santiago
    # La BD NO publica puertos al host: solo el backend la alcanza por la red
    # interna de compose (host 'db', puerto 5432). Asi nunca queda expuesta en
    # el servidor. Para desarrollo en el host (npm run dev contra esta BD), usa
    # el override docker-compose.dev.yaml (ver package.json > docker:db).
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # IMPORTANTE: dentro de la red de compose, la BD se alcanza por el NOMBRE
      # del servicio ('db') en el puerto interno 5432 — NO por localhost ni por
      # el puerto publicado al host (${POSTGRES_PORT}). Por eso construimos el
      # DATABASE_URL aca en vez de heredar ${DATABASE_URL} del .env, que esta
      # pensado para `npm start` en el host (localhost:${POSTGRES_PORT}).
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      # NODE_ENV configurable (default 'development' para docker LOCAL):
      #   - development → cookies de sesion sin `secure` → el login funciona
      #     por http://localhost (sin HTTPS), que es como se prueba en local.
      #   - production  → cookies `secure`+`sameSite=none` (requiere HTTPS).
      NODE_ENV: ${NODE_ENV:-development}
      # Spec 002 / H-01: sin TZ fijada, un contenedor Docker arranca en UTC
      # por defecto y toda hora ingresada por el usuario se guarda corrida
      # (ver research.md H-01 y __tests__/services/fechas.test.js).
      TZ: ${TZ:-America/Santiago}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', function(r){process.exit(r.statusCode===200?0:1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - node_modules:/app/node_modules

volumes:
  db:
  node_modules:
